<div class="app-window" id="MarkdownApp">
  <div class="app-header">
    <span class="app-title">📄 Markdown</span>
    <div class="app-controls"><button class="minimize-btn">–</button><button class="close-btn">×</button></div>
  </div>
  <div class="app-content">
    <div class="md">
      <textarea id="md-in" placeholder="# Write some markdown…"></textarea>
      <div id="md-out" class="md-out"></div>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
